<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026-09 必应壁纸</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0a0a;color:#e4e4e7}
    a{color:#a1a1aa;text-decoration:none}a:hover{color:#fafafa}

    .nav{padding:20px clamp(16px,4vw,48px);max-width:1400px;margin:0 auto}
    .nav a{font-size:.85rem;color:#52525b;transition:color .2s}.nav a:hover{color:#fafafa}

    .section{max-width:1400px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 60px}
    .section h1{font-size:clamp(1.5rem,3vw,2rem);font-weight:700;color:#fafafa;margin-bottom:8px}
    .section .count{font-size:.85rem;color:#52525b;margin-bottom:32px;display:block}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .card{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;opacity:0;transform:translateY(20px);transition:opacity .5s,transform .5s}
    .card.visible{opacity:1;transform:translateY(0)}
    .card img{width:100%;display:block;transition:transform .4s}
    .card:hover img{transform:scale(1.05)}
    .card .overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,10,.8) 0%,transparent 50%);display:flex;flex-direction:column;justify-content:flex-end;padding:16px;opacity:0;transition:opacity .3s}
    .card:hover .overlay{opacity:1}
    .card .overlay .card-title{font-size:.95rem;font-weight:500;color:#fafafa}
    .card .overlay .card-date{font-size:.8rem;color:#a1a1aa;margin-top:4px}

    .lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);align-items:center;justify-content:center;cursor:zoom-out}
    .lightbox.active{display:flex}
    .lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:4px}
    .lightbox .lb-info{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;color:#a1a1aa}
    .lightbox .lb-info .lb-title{font-size:1rem;color:#fafafa;margin-bottom:4px}
    .lightbox .lb-info .lb-meta{font-size:.8rem;color:#71717a}
    .lightbox .lb-close{position:absolute;top:24px;right:24px;width:40px;height:40px;background:#18181b;border:1px solid #27272a;border-radius:50%;color:#a1a1aa;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .lightbox .lb-close:hover{background:#27272a;color:#fafafa}
    .lightbox .lb-download{position:absolute;top:24px;right:80px;padding:8px 20px;background:#fafafa;color:#0a0a0a;border-radius:6px;font-size:.85rem;font-weight:500;cursor:pointer;text-decoration:none;transition:all .2s}
    .lightbox .lb-download:hover{background:#d4d4d8}
    .lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;background:rgba(24,24,27,.7);border:1px solid #3f3f46;border-radius:50%;color:#a1a1aa;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .lightbox .lb-nav:hover{background:#27272a;color:#fafafa}
    .lightbox .lb-prev{left:20px}
    .lightbox .lb-next{right:20px}

    @media(max-width:640px){
      .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
      .card .overlay{opacity:1;background:linear-gradient(0deg,rgba(10,10,10,.7) 0%,transparent 40%)}
      .lightbox .lb-nav{width:40px;height:40px;font-size:1.1rem}
      .lightbox .lb-prev{left:8px}
      .lightbox .lb-next{right:8px}
    }
  </style>
</head>
<body>
  <div class="nav"><a href="/">← 返回首页</a></div>
  <div class="section">
    <h1>2026-09 必应壁纸</h1>
    <span class="count">6 张壁纸</span>
    <div class="grid">
      <div class="card" onclick="openLightbox(0)">
        <img src="https://www.bing.com/th?id=OHR.LakeFyans_ZH-CN1067187791_1920x1080.jpg&rf=LaDigue_1920x1080.jpg&pid=hp" alt="倒影满湖的水库" loading="lazy">
        <div class="overlay">
          <span class="card-title">倒影满湖的水库</span>
          <span class="card-date">2026-09-06</span>
        </div>
      </div>
      <div class="card" onclick="openLightbox(1)">
        <img src="https://www.bing.com/th?id=OHR.GreenCrowned_ZH-CN0697075036_1920x1080.jpg&rf=LaDigue_1920x1080.jpg&pid=hp" alt="小小鸟儿，巨大影响" loading="lazy">
        <div class="overlay">
          <span class="card-title">小小鸟儿，巨大影响</span>
          <span class="card-date">2026-09-05</span>
        </div>
      </div>
      <div class="card" onclick="openLightbox(2)">
        <img src="https://www.bing.com/th?id=OHR.Westerheversand_ZH-CN0517707643_1920x1080.jpg&rf=LaDigue_1920x1080.jpg&pid=hp" alt="地平线上的红与白" loading="lazy">
        <div class="overlay">
          <span class="card-title">地平线上的红与白</span>
          <span class="card-date">2026-09-04</span>
        </div>
      </div>
      <div class="card" onclick="openLightbox(3)">
        <img src="https://www.bing.com/th?id=OHR.AZWilderness_ZH-CN2664566131_1920x1080.jpg&rf=LaDigue_1920x1080.jpg&pid=hp" alt="一部守护荒野的法案" loading="lazy">
        <div class="overlay">
          <span class="card-title">一部守护荒野的法案</span>
          <span class="card-date">2026-09-03</span>
        </div>
      </div>
      <div class="card" onclick="openLightbox(4)">
        <img src="https://www.bing.com/th?id=OHR.SuffolkHuts_ZH-CN2463818981_1920x1080.jpg&rf=LaDigue_1920x1080.jpg&pid=hp" alt="海岸边的缤纷色彩" loading="lazy">
        <div class="overlay">
          <span class="card-title">海岸边的缤纷色彩</span>
          <span class="card-date">2026-09-02</span>
        </div>
      </div>
      <div class="card" onclick="openLightbox(5)">
        <img src="https://www.bing.com/th?id=OHR.HorseHairShroom_ZH-CN2241458451_1920x1080.jpg&rf=LaDigue_1920x1080.jpg&pid=hp" alt="脚下的世界" loading="lazy">
        <div class="overlay">
          <span class="card-title">脚下的世界</span>
          <span class="card-date">2026-09-01</span>
        </div>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lb-close" onclick="closeLightbox()" aria-label="关闭">&times;</button>
    <a class="lb-download" id="lb-download" href="#" target="_blank" rel="noopener" onclick="event.stopPropagation()">查看原图</a>
    <button class="lb-nav lb-prev" onclick="event.stopPropagation();navigate(-1)" aria-label="上一张">&#8249;</button>
    <button class="lb-nav lb-next" onclick="event.stopPropagation();navigate(1)" aria-label="下一张">&#8250;</button>
    <img id="lb-img" src="" alt="">
    <div class="lb-info">
      <div class="lb-title" id="lb-title"></div>
      <div class="lb-meta" id="lb-meta"></div>
    </div>
  </div>

  <script>
    const items=[{"url":"https://www.bing.com/th?id=OHR.LakeFyans_ZH-CN1067187791_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"倒影满湖的水库","date":"2026-09-06","cr":"菲安斯湖，格兰屏国家公园，维多利亚州，澳大利亚 (© tracielouise/Getty Images)"},{"url":"https://www.bing.com/th?id=OHR.GreenCrowned_ZH-CN0697075036_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"小小鸟儿，巨大影响","date":"2026-09-05","cr":"龙虾爪花上取食的绿顶辉蜂鸟，哥斯达黎加 (© Paul Hobson/Nature Picture Library)"},{"url":"https://www.bing.com/th?id=OHR.Westerheversand_ZH-CN0517707643_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"地平线上的红与白","date":"2026-09-04","cr":"韦斯特黑弗的韦斯特黑弗桑德灯塔，石勒苏益格-荷尔斯泰因州，德国 (© bluejayphoto/Getty Images)"},{"url":"https://www.bing.com/th?id=OHR.AZWilderness_ZH-CN2664566131_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"一部守护荒野的法案","date":"2026-09-03","cr":"郊狼丘，朱红悬崖国家纪念区，亚利桑那州，美国 (© James Hager/Getty Images)"},{"url":"https://www.bing.com/th?id=OHR.SuffolkHuts_ZH-CN2463818981_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"海岸边的缤纷色彩","date":"2026-09-02","cr":"传统海滩小屋，索思沃尔德，萨福克遗产海岸，英格兰 (© stevendocwra/Getty Images)"},{"url":"https://www.bing.com/th?id=OHR.HorseHairShroom_ZH-CN2241458451_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"脚下的世界","date":"2026-09-01","cr":"马鬃小皮伞，白俄罗斯 (© Máté/Nature Picture Library)"}];
    let currentIndex=0;

    function openLightbox(index){
      currentIndex=index;
      const w=items[index];
      document.getElementById('lb-img').src=w.url;
      document.getElementById('lb-title').textContent=w.title;
      document.getElementById('lb-meta').textContent=w.date+' · '+w.cr;
      document.getElementById('lb-download').href=w.url;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow='hidden';
    }
    function navigate(dir){
      currentIndex=(currentIndex+dir+items.length)%items.length;
      const w=items[currentIndex];
      document.getElementById('lb-img').src=w.url;
      document.getElementById('lb-title').textContent=w.title;
      document.getElementById('lb-meta').textContent=w.date+' · '+w.cr;
      document.getElementById('lb-download').href=w.url;
    }
    function closeLightbox(){
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow='';
    }
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape')closeLightbox();
      if(e.key==='ArrowLeft')navigate(-1);
      if(e.key==='ArrowRight')navigate(1);
    });

    const observer=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}});
    },{threshold:0.1});
    document.querySelectorAll('.card').forEach(c=>observer.observe(c));
  </script>
</body>
</html>
