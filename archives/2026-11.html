<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0a0a;color:#e4e4e7}
    a{color:#a1a1aa;text-decoration:none}a:hover{color:#fafafa}

    .nav{padding:20px clamp(16px,4vw,48px);max-width:1400px;margin:0 auto}
    .nav a{font-size:.85rem;color:#52525b;transition:color .2s}.nav a:hover{color:#fafafa}

    .section{max-width:1400px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 60px}
    .section h1{font-size:clamp(1.5rem,3vw,2rem);font-weight:700;color:#fafafa;margin-bottom:8px}
    .section .count{font-size:.85rem;color:#52525b;margin-bottom:32px;display:block}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .card{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;opacity:0;transform:translateY(20px);transition:opacity .5s,transform .5s}
    .card.visible{opacity:1;transform:translateY(0)}
    .card img{width:100%;display:block;transition:transform .4s}
    .card:hover img{transform:scale(1.05)}
    .card .overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,10,.8) 0%,transparent 50%);display:flex;flex-direction:column;justify-content:flex-end;padding:16px;opacity:0;transition:opacity .3s}
    .card:hover .overlay{opacity:1}
    .card .overlay .card-title{font-size:.95rem;font-weight:500;color:#fafafa}
    .card .overlay .card-date{font-size:.8rem;color:#a1a1aa;margin-top:4px}

    .lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);align-items:center;justify-content:center;cursor:zoom-out}
    .lightbox.active{display:flex}
    .lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:4px}
    .lightbox .lb-info{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;color:#a1a1aa}
    .lightbox .lb-info .lb-title{font-size:1rem;color:#fafafa;margin-bottom:4px}
    .lightbox .lb-info .lb-meta{font-size:.8rem;color:#71717a}
    .lightbox .lb-close{position:absolute;top:24px;right:24px;width:40px;height:40px;background:#18181b;border:1px solid #27272a;border-radius:50%;color:#a1a1aa;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .lightbox .lb-close:hover{background:#27272a;color:#fafafa}
    .lightbox .lb-download{position:absolute;top:24px;right:80px;padding:8px 20px;background:#fafafa;color:#0a0a0a;border-radius:6px;font-size:.85rem;font-weight:500;cursor:pointer;text-decoration:none;transition:all .2s}
    .lightbox .lb-download:hover{background:#d4d4d8}
    .lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;background:rgba(24,24,27,.7);border:1px solid #3f3f46;border-radius:50%;color:#a1a1aa;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .lightbox .lb-nav:hover{background:#27272a;color:#fafafa}
    .lightbox .lb-prev{left:20px}
    .lightbox .lb-next{right:20px}

    @media(max-width:640px){
      .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
      .card .overlay{opacity:1;background:linear-gradient(0deg,rgba(10,10,10,.7) 0%,transparent 40%)}
      .lightbox .lb-nav{width:40px;height:40px;font-size:1.1rem}
      .lightbox .lb-prev{left:8px}
      .lightbox .lb-next{right:8px}
    }
  </style>
</head>
<body>

  <script>
    const items=[{"url":"https://www.bing.com/th?id=OHR.TrianaSpain_ZH-CN6329291776_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"艺术与韵律交汇之地","date":"2026-11-09","cr":"特里亚纳历史街区，塞维利亚，西班牙 (© Andrzej Rostek/Getty Images)"},{"url":"https://www.bing.com/th?id=OHR.DiwaliLamps_ZH-CN2462894749_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"光芒四射的节日","date":"2026-11-08","cr":"排灯节灯笼，孟买，马哈拉施特拉邦，印度 (© Dinodia Photo/Getty Images)"},{"url":"https://www.bing.com/th?id=OHR.DakotaBison_ZH-CN2302503868_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"归来的草原巨兽","date":"2026-11-07","cr":"草原上的一头野牛，西奥多·罗斯福国家公园，北达科他州，美国 (© Tandem Stock/Adobe Stock)"},{"url":"https://www.bing.com/th?id=OHR.PipiwaiTrail_ZH-CN1811194311_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"穿越毛伊岛的绿色隧道","date":"2026-11-06","cr":"竹林，皮皮维小径，哈莱亚卡拉国家公园，毛伊岛，夏威夷州，美国 (© MNStudio/Getty Images)"},{"url":"https://www.bing.com/th?id=OHR.StileCrossing_ZH-CN9811465935_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"向山巅再迈一步","date":"2026-11-05","cr":"石墙边的木制翻越梯，黑岩，湖区，英格兰 (© Alex Treadway/Getty Images)"},{"url":"https://www.bing.com/th?id=OHR.AutumnChina_ZH-CN7665959692_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"泛舟如画秋林","date":"2026-11-04","cr":"五彩落羽杉间划船的人们，宣城，安徽省，中国 (© Jackal Pan/Getty Images)"},{"url":"https://www.bing.com/th?id=OHR.AlpineBraies_ZH-CN7307997866_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"群峰间的宁静","date":"2026-11-03","cr":"布莱埃斯湖，法内斯-塞内斯-布莱埃斯湖自然公园，多洛米蒂山脉，意大利 (© leonid_tit/Getty Images)"},{"url":"https://www.bing.com/th?id=OHR.HudsonBear_ZH-CN6630706907_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"写在冰上的未来","date":"2026-11-02","cr":"北极熊和幼崽，哈得孙湾畔，马尼托巴省，加拿大 (© Danita Delimont/Adobe Stock)"},{"url":"https://www.bing.com/th?id=OHR.SchwarzwaldAutumn_ZH-CN6323627599_UHD.jpg&rf=LaDigue_1920x1080.jpg&pid=hp","title":"林间迷雾","date":"2026-11-01","cr":"黑森林，巴登-符腾堡州，德国 (© Britus/Getty Images)"}];
    let currentIndex=0;

    function openLightbox(index){
      currentIndex=index;
      const w=items[index];
      document.getElementById('lb-img').src=w.url;
      document.getElementById('lb-title').textContent=w.title;
      document.getElementById('lb-meta').textContent=w.date+' · '+w.cr;
      document.getElementById('lb-download').href=w.url;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow='hidden';
    }
    function navigate(dir){
      currentIndex=(currentIndex+dir+items.length)%items.length;
      const w=items[currentIndex];
      document.getElementById('lb-img').src=w.url;
      document.getElementById('lb-title').textContent=w.title;
      document.getElementById('lb-meta').textContent=w.date+' · '+w.cr;
      document.getElementById('lb-download').href=w.url;
    }
    function closeLightbox(){
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow='';
    }
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape')closeLightbox();
      if(e.key==='ArrowLeft')navigate(-1);
      if(e.key==='ArrowRight')navigate(1);
    });

    const observer=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}});
    },{threshold:0.1});
    document.querySelectorAll('.card').forEach(c=>observer.observe(c));
  </script>
